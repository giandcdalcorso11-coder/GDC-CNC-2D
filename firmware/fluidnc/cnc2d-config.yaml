# COPIA GENERATA, tenuta nel repository per poterla leggere e confrontare.
# La sorgente è il profilo macchina del SLICER (tab Impostazioni → Scarica
# config.yaml): modificare questo file a mano fa divergere le due copie.
#
# Sostituisce la versione scritta a mano, che aveva max_travel_mm 300 su
# entrambi gli assi, direction_pin senza :low su X, e i commenti in coda alle
# chiavi che il parser di FluidNC non accetta.
#
# GDC CNC 2D — configurazione FluidNC
#
# GENERATO dal profilo macchina del GDC CNC 2D SLICER.
# Non modificarlo a mano: la prossima generazione sovrascrive le modifiche.
# I numeri si cambiano nella tab Impostazioni, che rigenera questo file.
#
# Regola del parser: nessun commento in coda a una chiave: valore.
#
# Verifica al primo avvio: un movimento su X deve muovere il carrello
# lungo la trave, non tutto il portale.

name: GDC CNC 2D
board: ESP32 Dev Module

stepping:
  engine: RMT
  # Driver sempre abilitati: con origine manuale, un asse che si
  # ammorbidisce fa perdere la posizione in silenzio.
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: gpio.27

  # X — trave del portale: il carrello che porta la penna, sinistra→destra sul foglio
  x:
    # 94.2478 mm per giro ingranaggio (NOMINALE, da tarare)
    steps_per_mm: 33.953
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 200.000
    # Corsa dal blocco di homing. Totale 257.532 (8744 passi), blocco a 4.300 dalla battuta.
    # Percorribile 251.232 (margine 2.0).
    max_travel_mm: 253.232
    soft_limits: false

    motor0:
      # Finecorsa non montati: homing a mano sui blocchi stampati.
      hard_limits: false
      stepstick:
        step_pin: gpio.4
        direction_pin: gpio.26:low

  # Y — rotaie di base: ci scorre sopra tutto il portale, basso→alto sul foglio
  y:
    # 94.2478 mm per giro ingranaggio (NOMINALE, da tarare)
    steps_per_mm: 33.953
    max_rate_mm_per_min: 8000.000
    acceleration_mm_per_sec2: 200.000
    # Corsa dal blocco di homing. Totale 243.041 (8252 passi), blocco a 4.977 dalla battuta.
    # Percorribile 236.064 (margine 2.0).
    max_travel_mm: 238.064
    soft_limits: false

    motor0:
      # Finecorsa non montati: homing a mano sui blocchi stampati.
      hard_limits: false
      stepstick:
        step_pin: gpio.25
        direction_pin: gpio.33

  # Z non è un asse vero: è il servo del pen-lift.
  # Z0 = penna sul foglio, Z cresce in alto, in millimetri veri di penna.
  z:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 1000.000
    acceleration_mm_per_sec2: 100.000
    # Dal contatto alla posizione tappo: 65 gradi di servo.
    # L'alzata di lavoro è la quota intermedia Z2.945.
    max_travel_mm: 21.271
    soft_limits: false

    motor0:
      rc_servo:
        output_pin: gpio.32
        pwm_hz: 50
        # Z0 = penna abbassata, 25 gradi. Servo invertito: min > max, voluto.
        min_pulse_us: 2222
        # Z21.271 = posizione tappo, 90 gradi.
        max_pulse_us: 1500
        # Battuta dei cuscinetti a 17 gradi (2311 µs): sta fuori
        # dall'arco qui sopra, quindi FluidNC non può comandarla. È voluto.

user_outputs:
  # Verde, giallo, rosso: comandati con M62/M63 P0..P2.
  digital0_pin: gpio.18
  digital1_pin: gpio.19
  digital2_pin: gpio.2

start:
  # Niente finecorsa: l'origine la dà G92 e non sopravvive a un riavvio.
  must_home: false

macros:
  # All'accensione la penna sale in posizione tappo.
  # ATTENZIONE: FluidNC parte assumendo Z0, cioè il CONTATTO, e il servo
  # ci va per un istante prima di eseguire questa riga. Se il tappo è
  # ancora infilato e la testina è sopra il foglio, in quell'istante preme.
  # Regola: il tappo si toglie PRIMA di dare corrente.
  startup_line0: G90 G0 Z21.271
  startup_line1:
