<!-- IL LOGO CNC 2D RIDOTTO A LINEE DI PENNA.
     Non e' una copia del marchio: e' un'altra cosa. Il marchio di
     `cnc2d.svg` e' fatto di aree piene e di una maschera che ci ritaglia i
     contrografici, e una maschera un pennino non sa disegnarla. Questo
     disegno e' lo stesso logo tracciato come lo traccia una penna: linee.
     Corretto a mano dall'utente dentro allo SLICER e consegnato il
     2026-11-24, perche' la conversione al volo del marchio sbagliava.
     SE UN GIORNO IL MARCHIO CAMBIA, questo file NON si aggiorna da solo:
     vanno rifatti tutti e due. E' il prezzo di avere due file, ed e'
     scritto qui perche' chi cambia il logo lo legga. -->
